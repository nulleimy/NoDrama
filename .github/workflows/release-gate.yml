name: Release Gate

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify
        run: npm run verify

      - name: Release gate report
        if: github.event_name == 'pull_request'
        run: npm run release:gate

      - name: Strict release gate
        if: github.event_name == 'push'
        run: npm run release:gate:strict
